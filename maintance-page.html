<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - MrTimcakes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300&display=swap" rel="stylesheet">
    <style>
        body {
            background: #EEEEF4;
            font-family: "Roboto", sans-serif;
            font-weight: 100;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .maintenance-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .gear-large {
            font-size: 6rem;
            color: #F44;
            margin-bottom: 1rem;
            animation: rotateClockwise 3s linear infinite;
        }
        .gear-small {
            font-size: 3rem;
            color: #F44;
            margin-top: -2rem;
            margin-left: 2rem;
            animation: rotateCounterClockwise 2s linear infinite;
        }
        @keyframes rotateClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotateCounterClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        .footer {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-weight: 300;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <main class="maintenance-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="d-flex justify-content-center align-items-center mb-4">
                        <i class="bi bi-gear-fill gear-large"></i>
                        <i class="bi bi-gear-fill gear-small"></i>
                    </div>
                    <h1 class="display-1 fw-light text-danger mb-3">Under Maintenance</h1>
                    <h2 class="h3 fw-light mb-2">Sorry for the inconvenience.</h2>
                    <h3 class="h5 fw-light mb-3">To contact us in the meantime please email:</h3>
                    <a href="mailto:admin@MrTimcakes.com" class="h5 fw-normal text-danger text-decoration-none">admin@MrTimcakes.com</a>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">MrTimcakes</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
