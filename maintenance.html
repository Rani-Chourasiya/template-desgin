<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Under Maintenance</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

  <style>
    body, html {
      background: linear-gradient(285deg, #e8f7fc, #f9f9f9);
    }

    .maintenance-container {
      max-width: 800px;
      padding: 2rem 0 0;
    }

    .gear-container {
      position: absolute;
      bottom: 10%;
      right: 30%;
      width: 35%;
      opacity: 0.9;
      pointer-events: none;
    }

    @media (max-width: 767px) {
      .gear-container {
        display: none;
      }
    }

    .gear-large, .gear-medium, .gear-small {
      position: absolute;
      color: #6435c9;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
    }

    .gear-large {
      font-size: 14rem;
      top: -20px;
      right: 50px;
      animation: rotate-cw 5s linear infinite;
    }

    .gear-medium {
      font-size: 9rem;
      top: 80px;
      right: 10px;
      animation: rotate-ccw 3.75s linear infinite;
      color: #4fc1ea;
    }

    .gear-small {
      font-size: 6rem;
      top: 180px;
      right: 120px;
      animation: rotate-cw 2.5s linear infinite;
    }

    @keyframes rotate-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotate-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    .text-purple { color: #6435c9; }
    .text-blue { color: #4fc1ea; }
    .text-grey { color: #5f7f89; }

   .heading {
      font-size: 3.5rem;
      font-weight: 700;
    }

    @media (max-width: 767px) {
     .heading { font-size: 2.5rem; }
      .display-5 { font-size: 1.5rem; }
    }
     .bottom-copy{
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			min-height: 40px;
			text-align: center;
		}
  </style>
</head>
<body class="">

  <div class="container maintenance-container position-relative">

    <!-- Main Content -->
    <div class="text-center">
      <p class="text-blue fw-semibold fs-4">Under Maintenance</p>
      <h1 class="text-purple heading">
        <strong>We'll Be Back Soon.</strong>
      </h1>
      <p class="text-grey lead" style="line-height: 1.6; max-width: 600px; margin: 0 auto;">
        We're busy upgrading with new technology. <br>
        We apologize for the inconvenience.
      </p>

      <p class="mb-1">You can contact us through one of these channels:</p>
      <p>
        <a href="https://twitter.com" class="text-decoration-none text-purple fw-medium">Twitter</a> |
        <a href="https://www.facebook.com" class="text-decoration-none text-purple fw-medium">Facebook</a>
      </p>
    </div>

    <!-- Animated Gears (Icons) -->
    <div class="gear-container">
      <i class="bi bi-gear-fill gear-large"></i>
      <i class="bi bi-gear-fill gear-medium"></i>
      <i class="bi bi-gear-fill gear-small"></i>
    </div>

  </div>
<!-- Bottom Copy Section -->
  <section class="bottom-copy">

    <div>&copy; 2019 - 2025 Company. All rights reserved.</div>
  </section>
  <!-- Bootstrap JS (Optional for interactivity) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
