<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Repeating Masonry Card Layout</title>
    <style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(
    135deg,
    #0c0c0c 0%,
    #1a1a2e 25%,
    #16213e 50%,
    #0f3460 75%,
    #533483 100%
  );
  min-height: 100vh;
  overflow-x: hidden;
  font-family: "Arial", sans-serif;
  padding: 60px 0 120px 0; /* Increased top/bottom padding to prevent cropping */
  position: relative;
  touch-action: pan-x; /* Enable horizontal touch scrolling */
}

.scroll-wrapper {
  overflow-x: auto;
  overflow-y: visible; /* Changed from hidden to visible to prevent cropping */
  width: 100vw;
  scroll-behavior: smooth;
  /* Enable momentum scrolling on iOS */
  -webkit-overflow-scrolling: touch;
  /* Hide scrollbar but keep functionality */
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.scroll-wrapper::-webkit-scrollbar {
  display: none;
}

.masonry-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  transition: transform 0.8s ease-in-out;
  width: 500vw; /* 5 pages worth of content */
  min-height: calc(100vh - 180px); /* Ensure enough space for hover effects */
  padding: 20px 0; /* Extra padding to prevent cropping */
}

.row {
  display: flex;
  flex-wrap: nowrap;
  gap: 20px;
  padding: 0 20px; /* Add horizontal padding */
}

.row:nth-child(2) {
  margin-left: 150px;
}

.card {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  padding: 30px;
  min-height: 200px;
  flex: 0 0 280px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  transition: all 0.3s ease;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  /* Ensure cards have enough space for hover effects */
  margin: 15px 0;
}

.card:hover {
  transform: translateY(-10px) scale(1.02);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
  background: rgba(255, 255, 255, 0.25);
  z-index: 50;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(
    45deg,
    transparent 30%,
    rgba(255, 255, 255, 0.1) 50%,
    transparent 70%
  );
  transform: translateX(-100%);
  transition: transform 0.6s ease;
}

.card:hover::before {
  transform: translateX(100%);
}

.card-content {
  position: relative;
  z-index: 2;
}

.card h3 {
  color: white;
  margin-bottom: 15px;
  font-size: 1.4em;
  font-weight: 600;
}

.card p {
  color: rgba(255, 255, 255, 0.8);
  line-height: 1.6;
  font-size: 0.95em;
}

.plus-symbol {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 24px;
  height: 24px;
  color: rgba(255, 255, 255, 0.8);
  font-size: 20px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  transition: all 0.3s ease;
}

.card:hover .plus-symbol {
  background: rgba(255, 255, 255, 0.3);
  transform: rotate(90deg);
  color: white;
}

/* Mobile optimizations */
@media (max-width: 768px) {
  body {
    padding: 40px 0 100px 0;
  }

  .card {
    flex: 0 0 250px;
    padding: 20px;
    margin: 10px 0;
  }

  .row {
    gap: 15px;
    padding: 0 15px;
  }

  .row:nth-child(2) {
    margin-left: 100px;
  }

  .card h3 {
    font-size: 1.2em;
  }

  .card p {
    font-size: 0.9em;
  }
}

@media (prefers-reduced-motion: reduce) {
  /* Disable all animations and transitions */
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  /* Keep essential visual feedback but remove motion */
  .card:hover {
    transform: none !important;
    /* Keep color/opacity changes for accessibility */
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  }

  .card::before {
    display: none !important;
  }

  .card:hover::before {
    transform: none !important;
  }

  .plus-symbol {
    transition: none !important;
  }

  .card:hover .plus-symbol {
    transform: none !important;
    /* Keep color change for visual feedback */
    background: rgba(255, 255, 255, 0.3);
    color: white;
  }

  .dot {
    transition: none !important;
  }

  .dot:hover,
  .dot:focus {
    transform: none !important;
    /* Keep background change for accessibility */
    background: rgba(255, 255, 255, 0.7);
  }

  .dot.active::before {
    animation: none !important;
  }

  /* Remove scroll animations but keep functionality */
  .scroll-wrapper {
    scroll-behavior: auto !important;
  }

  .masonry-container {
    transition: none !important;
  }
}

.pagination-dots {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  padding: 15px 25px;
  border-radius: 50px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  /* Ensure dots stay at bottom on all devices */
  min-width: fit-content;
}

/* Additional mobile positioning for dots */
@media (max-width: 768px) {
  .pagination-dots {
    bottom: 15px;
    padding: 12px 20px;
  }
}

.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.4);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  border: none;
  /* Enhanced accessibility styles */
  outline: none;
}

.dot:hover {
  background: rgba(255, 255, 255, 0.7);
  transform: scale(1.2);
}

.dot:focus {
  background: rgba(255, 255, 255, 0.7);
  transform: scale(1.2);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
}

.dot.active {
  background: white;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
}

.dot.active:focus {
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
    0 0 0 3px rgba(255, 255, 255, 0.3);
}

.dot.active::before {
  content: "";
  position: absolute;
  top: -4px;
  left: -4px;
  right: -4px;
  bottom: -4px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

/* Screen reader only class for accessibility */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@keyframes pulse {
  0% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.5;
    transform: scale(1.1);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
</style>
</head>
<body>
    <div class="scroll-wrapper" id="scroll-wrapper">
  <div class="masonry-container" id="masonry-container">
    <div class="row" id="row-1"></div>
    <div class="row" id="row-2"></div>
  </div>
</div>
<div class="pagination-dots" role="tablist" aria-label="Card sections navigation" aria-describedby="pagination-help">
  <button class="dot active" data-page="0" role="tab" aria-selected="true" aria-label="Section 1 of 5 (current)" tabindex="0"></button>
  <button class="dot" data-page="1" role="tab" aria-selected="false" aria-label="Section 2 of 5" tabindex="-1"></button>
  <button class="dot" data-page="2" role="tab" aria-selected="false" aria-label="Section 3 of 5" tabindex="-1"></button>
  <button class="dot" data-page="3" role="tab" aria-selected="false" aria-label="Section 4 of 5" tabindex="-1"></button>
  <button class="dot" data-page="4" role="tab" aria-selected="false" aria-label="Section 5 of 5" tabindex="-1"></button>
</div>

<!-- Hidden accessibility description -->
<div id="pagination-help" class="sr-only">Use arrow keys to navigate between sections, Enter or Space to select, Home for first section, End for last section</div>
<script>
    const row1 = document.getElementById("row-1");
const row2 = document.getElementById("row-2");
const masonry = document.getElementById("masonry-container");
const scrollWrapper = document.getElementById("scroll-wrapper");
const dots = document.querySelectorAll(".dot");

const data = [
  {
    title: "Mobile First",
    text: "Responsive design that works perfectly on every device."
  },
  { title: "Future Ready", text: "Built for tomorrow's challenges today." },
  {
    title: "Research",
    text: "User research and analysis inform every decision."
  },
  {
    title: "Quality Assurance",
    text: "Rigorous testing ensures flawless delivery."
  },
  {
    title: "Scalability",
    text: "Built to handle massive growth without compromise."
  },
  { title: "Accessibility", text: "Inclusive experiences for all users." },
  {
    title: "Cloud Integration",
    text: "Scalable, secure cloud-first solutions."
  },
  { title: "Security", text: "Enterprise-grade defense built-in." },
  { title: "Performance", text: "Fast. Lean. Reliable." }
];

let cardIndex = 0;
let currentPage = 0;

function generateCard({ title, text }) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
        <div class="plus-symbol">+</div>
        <div class="card-content">
          <h3>${title}</h3>
          <p>${text}</p>
        </div>
      `;
  return card;
}

function addCards(row, count = 5) {
  for (let i = 0; i < count; i++) {
    const content = data[cardIndex % data.length];
    row.appendChild(generateCard(content));
    cardIndex++;
  }
}

function goToPage(index) {
  currentPage = index;
  const targetScroll = index * window.innerWidth;
  scrollWrapper.scrollTo({
    left: targetScroll,
    behavior: "smooth"
  });
  updateDots(index);
}

function updateDots(activeIndex) {
  dots.forEach((dot, i) => {
    const isActive = i === activeIndex;
    dot.classList.toggle("active", isActive);
    dot.setAttribute("aria-selected", isActive.toString());
    dot.setAttribute("tabindex", isActive ? "0" : "-1");

    // Update aria-label with current state
    dot.setAttribute(
      "aria-label",
      `Section ${i + 1} of ${dots.length}${isActive ? " (current)" : ""}`
    );
  });
}

// Handle scroll events to update pagination dots
let scrollTimeout;
scrollWrapper.addEventListener("scroll", () => {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const scrollLeft = scrollWrapper.scrollLeft;
    const pageWidth = window.innerWidth;
    const newPage = Math.round(scrollLeft / pageWidth);
    if (newPage !== currentPage && newPage >= 0 && newPage < dots.length) {
      currentPage = newPage;
      updateDots(currentPage);
    }
  }, 150);
});

// Touch events for better mobile experience
let touchStartX = 0;
let touchStartY = 0;
let touchEndX = 0;
let touchEndY = 0;

scrollWrapper.addEventListener(
  "touchstart",
  (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  },
  { passive: true }
);

scrollWrapper.addEventListener(
  "touchend",
  (e) => {
    touchEndX = e.changedTouches[0].clientX;
    touchEndY = e.changedTouches[0].clientY;
    handleSwipe();
  },
  { passive: true }
);

function handleSwipe() {
  const deltaX = touchEndX - touchStartX;
  const deltaY = touchEndY - touchStartY;
  const minSwipeDistance = 50;

  // Only handle horizontal swipes
  if (
    Math.abs(deltaX) > Math.abs(deltaY) &&
    Math.abs(deltaX) > minSwipeDistance
  ) {
    if (deltaX > 0 && currentPage > 0) {
      // Swipe right - go to previous page
      goToPage(currentPage - 1);
    } else if (deltaX < 0 && currentPage < dots.length - 1) {
      // Swipe left - go to next page
      goToPage(currentPage + 1);
    }
  }
}

// Dot click handlers
dots.forEach((dot, index) => {
  dot.addEventListener("click", () => goToPage(index));
});

// Enhanced keyboard navigation for accessibility
dots.forEach((dot, index) => {
  dot.addEventListener("keydown", (e) => {
    switch (e.key) {
      case "Enter":
      case " ":
        e.preventDefault();
        goToPage(index);
        break;
      case "ArrowLeft":
        e.preventDefault();
        if (index > 0) {
          dots[index - 1].focus();
        }
        break;
      case "ArrowRight":
        e.preventDefault();
        if (index < dots.length - 1) {
          dots[index + 1].focus();
        }
        break;
      case "Home":
        e.preventDefault();
        dots[0].focus();
        goToPage(0);
        break;
      case "End":
        e.preventDefault();
        dots[dots.length - 1].focus();
        goToPage(dots.length - 1);
        break;
    }
  });
});

// Initialize with cards
addCards(row1, 20);
addCards(row2, 20);

// Add more cards periodically
setInterval(() => {
  addCards(row1, 5);
  addCards(row2, 5);
}, 2000);

</script>
</body>
</html>
